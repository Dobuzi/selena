name: Deploy

# Builds & publishes Docker image to GitHub Container Registry.
# Optional: SSH deploy to a VPS when secrets are configured.
#
# Image: ghcr.io/dobuzi/selena:latest
# Pull & run:
#   docker pull ghcr.io/dobuzi/selena:latest
#   docker run -d -p 3000:3000 -v selena_data:/data ghcr.io/dobuzi/selena:latest

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional remote deploy — only runs when DEPLOY_HOST is set as a repo secret
  ssh-deploy:
    name: Deploy to VPS (optional)
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"
            docker stop selena || true
            docker rm selena || true
            docker run -d --name selena --restart unless-stopped \
              -p 3000:3000 \
              -v selena_data:/data \
              -e SELENA_DB_PATH=/data/selena.sqlite \
              -e XAI_API_KEY="${{ secrets.XAI_API_KEY }}" \
              "$IMAGE"
            docker image prune -f
